appName: SiteReport
shortDescription: SiteReport
fullDescription: 'Captura evidencias de campo y convierte el flujo de inspección en
  un informe compartible.


  Proyectos de inspección: Reúne datos del sitio, progreso, fotos e informes. Crear
  y gestionar proyectos de inspección Seguir el estado y el progreso Conservar fotos
  e informes del proyecto


  Listas de inspección: Usa planes y plantillas reutilizables para estandarizar el
  trabajo. Crear planes reutilizables Elegir plantillas y puntos de inspección Reanudar
  una inspección y ver su historial


  Fotos y ubicación: Asocia fotos de cada punto con notas, hora y ubicación cuando
  estén disponibles. Capturar una o varias fotos Asociarlas a un registro Guardar
  ubicación y hora cuando estén disponibles


  Notas y firmas: Registra hallazgos, recomendaciones y datos de firma. Registrar
  resultados y recomendaciones Gestionar perfiles de firma Incluir notas y firmas
  en el informe


  Informes PDF: Genera informes estructurados a partir de los datos de inspección.
  Generar un informe PDF Incluir resultados, fotos, ubicación, notas y firmas Previsualizar
  archivos generados


  Exportación y entrega: Exporta archivos y envíalos a un servidor configurado. Exportar
  PDF, imágenes y ZIP Compartir archivos desde el dispositivo Enviar mediante protocolos
  configurados


  Organiza proyectos, evidencias e informes en un solo flujo.'
