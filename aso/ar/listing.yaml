shortDescription: سجّل الفحوصات الميدانية بالصور وقوائم التحقق والموقع وتصدير PDF.
fullDescription: 'سجّل الأدلة الميدانية وحوّل خطوات الفحص إلى تقرير قابل للمشاركة.


  مشاريع الفحص: اجمع معلومات الموقع والتقدم والصور والتقارير في مكان واحد. إنشاء وإدارة
  مشاريع الفحص تتبع الحالة والتقدم حفظ صور المشروع وتقاريره معاً


  قوائم فحص: استخدم خططاً وقوالب قابلة لإعادة الاستخدام لتوحيد العمل. إنشاء خطط فحص
  قابلة لإعادة الاستخدام اختيار القوالب ونقاط الفحص استئناف الفحص ومراجعة السجل


  الصور وسجلات الموقع: اربط الصور بالعناصر وسجّل الملاحظات والوقت والموقع عند توفرها.
  التقاط صورة واحدة أو عدة صور ربط الصور بسجل الفحص تسجيل الموقع ووقت الالتقاط عند
  توفرهما


  الملاحظات والتوقيعات: سجّل النتائج والتوصيات وبيانات التوقيع. تسجيل النتائج والتوصيات
  إدارة ملفات التوقيع إضافة الملاحظات والتوقيعات إلى التقرير


  تقارير PDF: أنشئ تقارير ميدانية منظمة من بيانات الفحص. إنشاء تقرير ميداني بصيغة
  PDF إضافة النتائج والصور والموقع والملاحظات والتوقيعات مراجعة الملفات المنشأة


  التصدير والتسليم: صدّر الملفات وأرسلها إلى خادم تم إعداده. تصدير PDF والصور وZIP
  مشاركة الملفات من الجهاز الإرسال عبر البروتوكولات التي تم إعدادها


  نظّم المشاريع والأدلة والتقارير في سير عمل واحد.'
