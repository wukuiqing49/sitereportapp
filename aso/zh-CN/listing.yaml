appName: SiteReport
shortDescription: SiteReport 面向工程、施工、物业设施和安全验收团队，集中管理巡检项目、检查清单、照片证据、位置记录、签字与 PDF 报告。
fullDescription: 'SiteReport 面向工程、施工、物业和安全验收团队，帮助你创建巡检项目、使用检查清单、关联照片与位置记录，补充现场备注和签字，并生成可分享的
  PDF 报告。


  巡检项目: 集中管理项目资料、进度、照片和报告。 创建和管理巡检项目 跟踪项目状态和巡检进度 集中保存项目照片和报告


  巡检清单: 使用可复用的巡检计划和检查模板。 创建可复用的巡检计划 选择检查模板并定义检查点 恢复未完成的巡检并查看运行历史


  照片证据与位置记录: 为检查项拍照，并关联备注、时间和位置信息。 为检查项拍摄一张或多张照片 将照片关联到检查记录 在条件允许时记录位置和拍摄时间


  现场备注与签字: 记录问题、整改建议和签字资料。 记录巡检结果、问题和建议 管理现场角色的签字资料 将备注和签字信息纳入报告


  PDF 与报告生成: 从巡检数据生成结构化现场报告。 生成 PDF 现场报告 包含检查结果、照片、位置、备注和签字 预览并重新打开已生成的报告


  导出与服务器交付: 导出报告文件，并在配置后发送到服务器。 导出 PDF、图片和 ZIP 报告包 从设备分享生成的报告文件 使用已配置的服务器协议上传


  把项目资料、巡检证据、问题记录、签字信息与最终报告放在同一条工作流中，减少现场记录与报告整理之间的重复工作。'
